<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F5FC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ORIENT! – Zamień spacer w przygodę</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%235E17EB' stroke-width='5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%232E6B1F'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <style>
    :root {
      /* ====== KOLORY ORIENT! – zmieniaj tylko tutaj ====== */
      --glowny: #5E17EB;       /* fiolet z prezentacji (cyfryzacja) – kółka punktów, główne przyciski */
      --zielen: #2E6B1F;       /* leśna zieleń – zdobyte punkty, sukces */
      --tusz: #0F1529;         /* granat z prezentacji – tekst i ciemne przyciski */
      --tlo: #F7F5FC;          /* tło aplikacji (lekko fioletowa biel) */
      --karta: #FFFFFF;
      --szary: #5F6475;
      --linia: #E4E0F0;
      --zielen-jasna: #EAF3E5;
      --glowny-jasny: rgba(94,23,235,.18);
      /* =================================================== */
      --cien: 0 2px 0 rgba(15,21,41,.05), 0 8px 24px rgba(15,21,41,.08);
      --r: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--tlo); color: var(--tusz); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px; line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    #app { max-width: 520px; margin: 0 auto; padding: 16px 18px 48px; min-height: 100vh; }
    button { font: inherit; color: inherit; cursor: pointer; }
    h1, h2, h3 { line-height: 1.15; margin: 0; letter-spacing: -0.01em; }
    p { margin: 0; }

    /* ---------- nagłówek ---------- */
    .gora { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; min-height: 44px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 22px; letter-spacing: 0.02em; }
    .kolko {
      width: 30px; height: 30px; border-radius: 50%;
      border: 4px solid var(--glowny); position: relative; flex: none;
    }
    .kolko::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--zielen); }
    .wstecz {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--linia);
      background: var(--karta); display: grid; place-items: center; font-size: 20px; flex: none;
    }
    .gora .tytul { font-weight: 700; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .odstep { flex: 1; }
    .ikonka-btn {
      height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--linia);
      background: var(--karta); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    }

    /* ---------- karty i przyciski ---------- */
    .karta { background: var(--karta); border-radius: var(--r); box-shadow: var(--cien); padding: 18px; }
    .stos > * + * { margin-top: 14px; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      min-height: 54px; border: 0; border-radius: 16px; font-weight: 700; font-size: 17px;
      background: var(--tusz); color: #fff; padding: 0 18px; text-decoration: none;
    }
    .btn.glowny { background: var(--glowny); }
    .btn.jasny { background: var(--karta); color: var(--tusz); border: 1px solid var(--linia); }
    .btn:active { transform: scale(.98); }
    .maly { font-size: 14px; color: var(--szary); }
    .etykieta { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--szary); }

    /* ---------- ekran główny ---------- */
    .hero { padding: 6px 2px 20px; }
    .hero h1 { font-size: 34px; font-weight: 800; }
    .hero h1 span { color: var(--glowny); }
    .hero p { color: var(--szary); margin-top: 8px; font-size: 17px; }
    .trasa-karta { display: block; width: 100%; text-align: left; border: 0; position: relative; overflow: hidden; }
    .trasa-karta::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--kolor, var(--glowny)); }
    .trasa-karta h2 { font-size: 21px; margin-bottom: 4px; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--tlo); color: var(--tusz); }
    .pasek { height: 8px; border-radius: 4px; background: var(--linia); margin-top: 14px; overflow: hidden; }
    .pasek > i { display: block; height: 100%; background: var(--kolor, var(--glowny)); border-radius: 4px; transition: width .4s; }
    .tryb-baner {
      background: #FFF3E0; color: #8A4B00; border-radius: 12px; padding: 10px 14px;
      font-size: 14px; font-weight: 600; margin-bottom: 14px;
    }

    /* ---------- mapa ---------- */
    #mapa { height: 280px; border-radius: var(--r); overflow: hidden; box-shadow: var(--cien); background: #e9efe6; z-index: 0; }
    .pk-ikona {
      width: 34px; height: 34px; border-radius: 50%; border: 4px solid var(--glowny); background: rgba(255,255,255,.75);
      display: grid; place-items: center; font-weight: 800; font-size: 13px; color: var(--glowny);
    }
    .pk-ikona.zdobyty { background: var(--zielen); border-color: var(--zielen); color: #fff; }
    .pk-ikona.nastepny { box-shadow: 0 0 0 6px var(--glowny-jasny); }
    .ja-ikona { width: 18px; height: 18px; border-radius: 50%; background: #1E88E5; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(30,136,229,.25); }

    /* ---------- lista etapów ---------- */
    .etap { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--linia); }
    .etap:first-child { border-top: 0; padding-top: 2px; }
    .nr {
      width: 36px; height: 36px; flex: none; border-radius: 50%; border: 3px solid var(--glowny);
      color: var(--glowny); display: grid; place-items: center; font-weight: 800; font-size: 15px;
    }
    .etap.zdobyty .nr { background: var(--zielen); border-color: var(--zielen); color: #fff; font-size: 18px; }
    .etap.ukryty .nr { border-color: var(--linia); color: var(--szary); }
    .etap h3 { font-size: 17px; }
    .etap .tresc { flex: 1; min-width: 0; }
    .etap .wsk { color: var(--szary); font-size: 15px; margin-top: 2px; }
    .test-btn {
      margin-top: 8px; font-size: 13px; font-weight: 700; border: 1px dashed #F57C00; color: #8A4B00;
      background: #FFF8EF; border-radius: 10px; padding: 6px 10px;
    }

    /* ---------- ekran punktu ---------- */
    .srodek { text-align: center; }
    .duza-ikona { font-size: 72px; line-height: 1; margin: 6px 0 10px; }
    .kod-pk { display: inline-block; font-weight: 800; color: var(--glowny); border: 3px solid var(--glowny); border-radius: 999px; padding: 2px 12px; font-size: 14px; }
    .ciekawostka { font-size: 19px; line-height: 1.5; text-align: left; }
    .ciekawostka-naglowek { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .odp { display: block; width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--linia); background: var(--karta); font-weight: 600; margin-top: 10px; }
    .odp.zle { border-color: #E57373; background: #FDECEC; animation: trzes .35s; }
    .odp.dobrze { border-color: var(--zielen); background: var(--zielen-jasna); }
    @keyframes trzes { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    .spinner { width: 54px; height: 54px; border-radius: 50%; border: 6px solid var(--linia); border-top-color: var(--glowny); margin: 30px auto 18px; animation: krec 1s linear infinite; }
    @keyframes krec { to { transform: rotate(360deg); } }

    /* ---------- trofea ---------- */
    .trofeum-pokaz { animation: wskocz .6s cubic-bezier(.2,1.6,.4,1); }
    @keyframes wskocz { from { transform: scale(.3) rotate(-15deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .medal {
      width: 132px; height: 132px; border-radius: 50%; margin: 6px auto 14px; display: grid; place-items: center;
      font-size: 64px; background: radial-gradient(circle at 35% 30%, #FFE7A3, #F5B700 70%, #D49A00);
      box-shadow: 0 0 0 8px #FFF3C4, 0 10px 30px rgba(213,154,0,.35);
    }
    .siatka { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .trofeum { text-align: center; }
    .trofeum .m {
      width: 72px; height: 72px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; font-size: 34px;
      background: radial-gradient(circle at 35% 30%, #FFE7A3, #F5B700 70%, #D49A00);
    }
    .trofeum.brak .m { background: var(--linia); filter: grayscale(1); opacity: .6; font-size: 26px; color: var(--szary); font-weight: 800; }
    .trofeum .n { font-size: 13px; font-weight: 600; line-height: 1.25; }
    .trofeum.brak .n { color: var(--szary); }

    /* ---------- konfetti ---------- */
    .konfetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
    .konfetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: spadaj linear forwards; }
    @keyframes spadaj { to { transform: translateY(110vh) rotate(720deg); } }

    /* ---------- ustawienia ---------- */
    .przelacznik { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--linia); }
    .przelacznik:first-child { border-top: 0; padding-top: 0; }
    .przelacznik .opis { flex: 1; }
    .przelacznik input { width: 26px; height: 26px; accent-color: var(--glowny); }
    .wspolrzedne { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; background: var(--tlo); border-radius: 10px; padding: 10px 12px; word-break: break-all; }
    .tworca { border: 2px dashed #F57C00; }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <script src="lib/leaflet/leaflet.js"></script>
  <script src="dane.js"></script>
  <script src="app.js"></script>
</body>
</html>
